[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
# See matching comment on [tool.ruff.lint.isort] above - keeps isort and
# ruff's isort rule agreeing on same-module import statements instead of
# fighting over the "correct" arrangement.
combine_as_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Task 3 (real-browser smoke): real_browser tests launch a REAL Chromium
# and are excluded from the DEFAULT run via addopts below - they have
# different time budgets and are only meaningful where a browser binary is
# installed. Run them explicitly: pytest -m real_browser (a CLI -m flag
# overrides the addopts filter, argparse last-wins).
addopts = """
    -ra
    --strict-markers
    --strict-config
    --showlocals
    -m "not real_browser"
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "real_browser: launches REAL Chromium against local pages; excluded from the default run, execute explicitly with '-m real_browser' (or 'make test-real-browser')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

# FIX (CI lint job): ruff's built-in isort (rule "I") and the standalone
# isort tool (run as a separate CI step) disagreed on how to arrange
# multiple `from playwright.async_api import X` / `import Y as Z` lines
# from the same module - each considered the other's output "incorrectly
# sorted" and rewrote it back, so the two CI steps could never both pass
# at once for that file. combine_as_imports=true (set for both tools
# below and in [tool.isort]) merges non-aliased and aliased names from
# the same module into one import statement, which both tools agree on.
[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true