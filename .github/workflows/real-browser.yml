# Task 3 (real-browser smoke): a SEPARATE, OPTIONAL workflow for the
# real-Chromium smoke suite (tests/test_real_browser_smoke.py, marker
# real_browser). Deliberately NOT part of ci.yml:
#
# - The default pytest run excludes real_browser via pyproject addopts,
#   so PR CI stays fast and hermetic.
# - A browser job is the most flaky-prone kind (OS-level resources,
#   GPU/fonts on runners); running it on every push would make the main
#   pipeline noisy for little signal.
# - A separate file with its own `schedule` trigger means the weekly cron
#   does NOT re-run lint/unit/security/docker - only this job.
#
# Runs: weekly (Sunday 03:00 UTC) + manual dispatch. continue-on-error is
# ON while the suite is young (same policy as the e2e job in ci.yml);
# flip to false once it has proven stable.
name: Real Browser Smoke

on:
  schedule:
    # Weekly, Sundays 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  real-browser-smoke:
    name: Real Chromium Smoke (local pages)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-real-browser-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-real-browser-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright Chromium with system deps
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser smoke tests
        env:
          OPENAI_API_KEY: "sk-test-key-for-ci-not-real"
          API_BASE_URL: "https://api.test.com/v1"
          MODEL_NAME: "test-provider/test-model"
          HEADLESS: "true"
        run: |
          python -m pytest tests/test_real_browser_smoke.py \
            -m real_browser \
            -v \
            --tb=short \
            --asyncio-mode=auto