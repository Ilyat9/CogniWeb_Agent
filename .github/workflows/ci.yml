name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Позволяет запускать вручную

env:
  PYTHON_VERSION: '3.11'
  PLAYWRIGHT_VERSION: '1.40.0'

jobs:
  # ==========================================================================
  # JOB 1: Linting & Code Quality
  # ==========================================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt', 'requirements/lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
      
      # Lint scope is src/ tests/ ONLY. scripts/diagnostics/ holds standalone
      # diagnostic tools (e.g. uvicorn_startup_probe.py) that are deliberately
      # outside the code-quality gates - also excluded via pyproject.toml
      # ([tool.ruff] extend-exclude, black extend-exclude, isort extend_skip).
      - name: Run ruff (fast linter)
        run: ruff check src/ tests/

      - name: Check code formatting (black)
        run: black --check src/ tests/

      - name: Check import sorting (isort)
        run: isort --check-only src/ tests/

  # ==========================================================================
  # JOB 2: Unit Tests
  # ==========================================================================
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt', 'requirements/lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
      
      - name: Install Playwright browsers with system deps
        run: |
          python -m playwright install --with-deps chromium
      
      - name: Create test directories
        run: |
          mkdir -p screenshots browser_data logs
      
      - name: Run pytest with coverage
        env:
          OPENAI_API_KEY: "sk-test-key-for-ci-not-real"
          API_BASE_URL: "https://api.test.com/v1"
          MODEL_NAME: "test-provider/test-model"
          HEADLESS: "true"
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --maxfail=3 \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --asyncio-mode=auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

  # ==========================================================================
  # JOB 3: Security Scan
  # ==========================================================================
  # FIX (decorative security gate): both scan steps used to end in
  # `|| true`, so this job was green no matter what they found - the only
  # barrier between a vulnerable dependency / insecure code and the docker
  # job (which `needs: security`) did not actually block anything. The
  # `|| true` are gone; bandit additionally runs with the SAME config the
  # developers use locally (`-c .bandit`) instead of a different, wider
  # rule set, so "clean locally" and "clean in CI" mean the same thing.
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Run dependency vulnerability audit (pip-audit)
        # FIX note: safety was replaced by pip-audit - safety 3.x requires
        # an interactive account login for `safety scan` and its legacy
        # `check` endpoint is dead, so it cannot gate a CI job. pip-audit
        # (PyPA) resolves the four requirements files AND the exact frozen
        # deployable set (requirements/lock.txt) and FAILS on any known
        # CVE in either - a real, unauthenticated gate. Auditing the lock
        # matters because that is what production actually installs.
        run: |
          python -m pip install "pip-audit>=2.6,<3"
          pip-audit \
            -r requirements/base.txt \
            -r requirements/api.txt \
            -r requirements/ui.txt \
            -r requirements/tools.txt \
            -r requirements/lock.txt

      - name: Run bandit (code security issues)
        run: |
          python -m pip install bandit
          bandit -r src/ -c .bandit -f json -o bandit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ==========================================================================
  # JOB 3b: E2E real-browser smoke
  # ==========================================================================
  # The unit suite is AsyncMock-based (83% coverage covers decision logic,
  # not the real DOM/Chromium interaction). This job runs the one true
  # end-to-end smoke: real Playwright Chromium against an in-process
  # localhost page (fully self-contained, no internet). Deliberately
  # continue-on-error for now so a flaky browser job cannot block the
  # pipeline while the suite is young - flip to false once it has proven
  # stable.
  e2e:
    name: E2E Real Browser Smoke
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run e2e smoke test
        env:
          OPENAI_API_KEY: "sk-test-key-for-ci-not-real"
          API_BASE_URL: "https://api.test.com/v1"
          MODEL_NAME: "test-provider/test-model"
          HEADLESS: "true"
        run: |
          python -m pytest tests/test_e2e_real_browser.py -m e2e -v --tb=short --asyncio-mode=auto

  # ==========================================================================
  # JOB 3c: Lock-file environment verification
  # ==========================================================================
  # requirements/lock.txt pins the EXACT environment the suite was validated
  # against (see its header). The matrix job above deliberately installs
  # bounded ranges across several Python versions; this job proves the
  # frozen set itself still installs and passes the suite, so "deploy from
  # the lock" stays a tested path rather than an assumption. Runs on the
  # same Python major the lock was generated under.
  lock-verify:
    name: Verify Pinned Lock Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install exactly the locked environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/lock.txt

      - name: Create test directories
        # Same preparation as the matrix job - some tests write into the
        # repo-level screenshots/ browser_data/ logs/ defaults.
        run: |
          mkdir -p screenshots browser_data logs

      - name: Run test suite under the locked versions
        env:
          OPENAI_API_KEY: "sk-test-key-for-ci-not-real"
          API_BASE_URL: "https://api.test.com/v1"
          MODEL_NAME: "test-provider/test-model"
          HEADLESS: "true"
        run: |
          python -m pytest tests/ -q --tb=short --maxfail=3 --asyncio-mode=auto

  # ==========================================================================
  # JOB 4: Docker Build (only on main/develop)
  # ==========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [lint, test, security, lock-verify]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # FIX (docker job): push:false alone does NOT make the image
          # available to the local Docker daemon when using the
          # buildx/docker-container driver - the image only exists inside
          # buildx's own build cache. The later "Test Docker image" step
          # runs `docker run cogniweb-agent:<sha>` directly against the
          # daemon, which is why it failed with "Unable to find image ...
          # locally" / "pull access denied" (docker tried to pull a
          # nonexistent remote image instead of finding a local build).
          # `load: true` explicitly imports the built image into the local
          # daemon so it's actually runnable afterward.
          load: true
          push: false
          tags: cogniweb-agent:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      
      # Prevents cache from growing indefinitely
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      
      - name: Test Docker image
        # The image's ENTRYPOINT is ["sh", "-c"], so the whole command must
        # arrive as ONE CMD string - a bare "--version" would be parsed by
        # sh itself ("Illegal option --", exit 2) and never reach main.py.
        #
        # FIX (Python version drift, audit item 19): the prod image's Python
        # version is now ASSERTED, not assumed. The base tag
        # mcr.microsoft.com/playwright/python:v1.40.0-jammy carries Ubuntu
        # 22.04's Python 3.10 - the lower bound of the CI matrix and ruff's
        # target-version. If the base tag is ever bumped to a different
        # major Python, this check fails loudly instead of silently moving
        # prod onto an untested interpreter.
        run: |
          docker run --rm cogniweb-agent:${{ github.sha }} "python main.py --version"
          PYV=$(docker run --rm cogniweb-agent:${{ github.sha }} "python -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")'")
          echo "Image Python version: $PYV"
          [ "$PYV" = "3.10" ] || { echo "ERROR: expected Python 3.10 in prod image, got $PYV"; exit 1; }

  # ==========================================================================
  # JOB 5: Notify on Success/Failure
  # ==========================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security, lock-verify, docker]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          # FIX: previously this only inspected needs.test.result, so a
          # failing lint, security, or docker job was silently ignored and
          # the workflow could still report success overall. Now every
          # upstream job's result is checked explicitly.
          failed=0
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "Lint failed!"
            failed=1
          fi
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "Tests failed!"
            failed=1
          fi
          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "Security scan failed!"
            failed=1
          fi
          if [[ "${{ needs.lock-verify.result }}" == "failure" ]]; then
            echo "Lock environment verification failed!"
            failed=1
          fi
          if [[ "${{ needs.docker.result }}" == "failure" ]]; then
            echo "Docker build failed!"
            failed=1
          fi

          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
          echo "All checks passed!"